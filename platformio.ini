; PlatformIO Project Configuration File
;
; Proyek: BAIK untuk ESP32 (bahasa skrip BAIK + REPL serial + editor web)
; Dokumentasi: https://docs.platformio.org/page/projectconf.html
;
; Catatan gaya: semua komentar sengaja ditaruh pada barisnya sendiri
; (bukan di belakang nilai), supaya aman terhadap semua versi parser
; platformio.ini, termasuk pada nilai yang ditulis multi-baris.

; =====================================================================
; [env] = konfigurasi BERSAMA yang otomatis diwarisi semua env di bawah,
; supaya esp32doit-devkit-v1 dan esp32-s3-devkitc-1 tidak perlu
; menyalin-tempel opsi yang sama.
; =====================================================================
[env]
platform = espressif32
framework = arduino

; --- Serial ----------------------------------------------------------
; monitor_speed harus sama dengan console.begin(115200) di src/main.cpp.
monitor_speed = 115200

; Unggah cepat. Turunkan ke 460800 atau 115200 bila kabel/jembatan
; USB-serial papanmu sering gagal ("Timed out waiting for packet header").
upload_speed = 921600

; Terjemahkan alamat pada backtrace panic menjadi berkas + nomor baris.
monitor_filters = esp32_exception_decoder

; --- Sistem berkas & partisi -----------------------------------------
; Isi direktori data/ diunggah dengan: pio run -t uploadfs
; Skrip /baik.ina, /index.html, dan /config.html dibaca dari sini saat runtime.
board_build.filesystem = spiffs

; --- Bendera kompilasi GLOBAL ----------------------------------------
; build_flags berlaku untuk SELURUH proyek: framework Arduino, pustaka
; pihak ketiga, dan src/. Karena itu isinya dibatasi pada hal yang memang
; harus global saja.
;
;   -Ofast               optimalkan kecepatan interpreter BAIK
;   -DBAIK_GENERATE_INAC aktifkan generator bytecode BAIK
;   -DCS_MMAP            dukungan mmap pada inti BAIK
;   -lm                  pustaka matematika
;   -ldl                 menyertai CS_MMAP pada inti BAIK; HAPUS bila penaut
;                        mengeluh "cannot find -ldl"
build_flags =
    -Ofast
    -DBAIK_GENERATE_INAC
    -DCS_MMAP
    -lm
    -ldl

; --- Bendera kompilasi KHUSUS src/ -----------------------------------
; build_src_flags hanya berlaku untuk berkas di dalam src/ (rekursif),
; jadi standar bahasa yang kita paksakan tidak ikut mengubah cara
; framework Arduino dan pustaka pihak ketiga dikompilasi.
;
; Soal -std: build_flags maupun build_src_flags dipakai untuk C DAN C++,
; TAPI SCons (mesin build PlatformIO) memilah bendera "-std=" berdasarkan
; isinya - yang mengandung "++" masuk ke CXXFLAGS, sisanya ke CFLAGS
; (lihat SCons/Environment.py fungsi ParseFlags). Jadi:
;
;   -std=gnu99    -> hanya berkas .c   (src/baik.c)
;   -std=gnu++17  -> hanya berkas .cpp (src/*.cpp dan src/esp32/*.cpp)
;
; sehingga tidak ada lagi peringatan g++ "command-line option '-std=c99'
; is valid for C but not for C++". Karena bendera ini ditambahkan paling
; akhir, ia juga menang atas -std=gnu++11 bawaan core Arduino, tanpa perlu
; build_unflags.
;
; gnu99 dipakai (bukan c99 murni) karena inti BAIK dan header newlib/ESP-IDF
; memerlukan ekstensi GNU/POSIX yang disembunyikan oleh -std=c99.
;
; -Wall sengaja di sini, bukan di build_flags, supaya peringatan yang muncul
; hanya berasal dari kode kita sendiri.
build_src_flags =
    -Wall
    -std=gnu99
    -std=gnu++17

; --- Sumber yang dikompilasi -----------------------------------------
; TIDAK ada build_src_filter di sini dengan sengaja. Bawaan PlatformIO adalah
; "+<*>" yang menelusuri src/ secara REKURSIF, sehingga src/esp32/*.cpp
; (binding API ESP32) ikut terkompilasi tanpa konfigurasi tambahan.
; Memasang build_src_filter justru berisiko mengecualikan subdirektori itu.

; --- Pustaka ---------------------------------------------------------
lib_deps =
    https://github.com/anak10thn/ESP32Console.git
    https://github.com/me-no-dev/ESPAsyncWebServer

; =====================================================================
; Papan 1: ESP32 klasik - DOIT DevKit V1 (flash 4 MB)
; =====================================================================
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1

; huge_app.csv: satu partisi aplikasi 3 MB + SPIFFS ~1 MB.
; Dipilih karena firmware BAIK + WiFi + AsyncWebServer tidak muat pada skema
; bawaan (yang hanya memberi 1,2 MB per partisi OTA).
; Konsekuensi: tidak ada OTA, karena hanya tersedia satu slot aplikasi.
board_build.partitions = huge_app.csv

; board_build.arduino.memory_type = dio_opi
; build_type = debug

; =====================================================================
; Papan 2: ESP32-S3 DevKitC-1 (flash 8 MB)
; Driver macOS: https://www.wch.cn/downloads/CH34XSER_MAC_ZIP.html
;   (berkas dmg untuk Apple Silicon M1/M2, pkg untuk Intel)
; =====================================================================
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; default_8MB.csv: dua partisi aplikasi @3 MB (OTA tetap mungkin)
; + SPIFFS ~1,5 MB. Cocok dengan devkitc-1 yang memang berflash 8 MB.
board_build.partitions = default_8MB.csv

; upload_port = /dev/cu.wchusbserial*
